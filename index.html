<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Gacha Simulator</h1>
    <div class="pricing-info">
        1 Pull = 10 Gems = <strong>RM 2.00</strong>
    </div>

    <div class="stats">
        <p>Total Pulls: <span id="total-pulls">0</span></p>
        <p>Gems Spent: <span id="gems-spent">0</span></p>
        <p>Total Cost: <span id="rm-spent">RM 0.00</span></p>
    </div>

    <div class="controls">
        <button id="pull-1-btn">1x Pull</button>
        <button id="pull-10-btn" class="ten-pull">10x Pull</button>
        <br>
        <button id="reset-btn" class="reset">Reset Stats</button>
    </div>

    <div id="results"></div>

    <div class="inventory">
        <h3>Pull History</h3>
        <p style="color: #808080;">Regular (85%): <span id="count-regular">0</span></p>
        <p style="color: #da70d6;">Rare (10%): <span id="count-rare">0</span></p>
        <p style="color: #FFD700;">Super Rare (4%): <span id="count-sr">0</span></p>
        <p style="color: #b9f2ff;">Super Super Rare (0.8%): <span id="count-ssr">0</span></p>
        <p style="color: #ff69b4;">Ultra Rare (0.2%): <span id="count-ur">0</span></p>
    </div>

    <!-- Guilt Trip Alert Modal -->
    <div id="guilt-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="guilt-title">🚨 REALITY CHECK 🚨</h2>
            <p id="guilt-spent" class="guilt-amount"></p>
            <p id="guilt-message" class="guilt-text"></p>
            <button id="guilt-close-btn">I accept my poor life choices</button>
        </div>
    </div>

    <!-- Ultra Rare Jackpot Modal -->
    <div id="ur-modal" class="modal-overlay hidden">
        <div class="modal-content ur-content">
            <div class="sparkle-header">✨ ULTRA RARE JACKPOT ✨</div>
            <h2 id="ur-title">YOU FINALLY GOT IT!</h2>
            <div class="ur-badge">ULTRA RARE</div>
            <p id="ur-stats" class="guilt-amount"></p>
            <p id="ur-message" class="guilt-text"></p>
            <button id="ur-close-btn">...I regret everything</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
